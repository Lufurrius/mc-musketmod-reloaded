plugins {
    // Minecraft 26.x is unobfuscated: use the non-remapping Loom plugin (fully-qualified id).
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

file("../gradle.properties").withInputStream {
    def props = new Properties()
    props.load(it)
    props.each { prop -> project.ext.set(prop.key, prop.value) }
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_name}-${minecraft_version}-fabric"
}

eclipse {
    project { name = "${mod_name}-${minecraft_version}-fabric" }
}

sourceSets.main.java { srcDir '../src/main/java' }
sourceSets.main.resources { srcDir '../src/main/resources' }

loom {
	accessWidenerPath = file("src/main/resources/musketmod.aw")

    runs {
        client {
            runDir = '../run'
            programArgs('--username', 'Dev')
        }
        server {
            runDir = '../run'
        }
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    // Minecraft 26.x ships deobfuscated (Mojang official names), so Loom needs no
    // 'mappings' declaration and mod dependencies are added without remapping.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", mod_version

    filesMatching("fabric.mod.json") {
        expand "version": mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
